[build-system]
build-backend = "hatchling.build"
requires = [
    "hatchling",
]

[project]
name = "aa-hostile-intel"
description = "hostile Intel for Alliance Auth (GitHub Version)"
readme = "README.md"
keywords = [
    "allianceauth",
    "hostile",
]
license = { file = "LICENSE" }
authors = [
    { name = "BioBrute", email = "broodlk@gmail.com" },
]
requires-python = ">=3.10,<3.13"
classifiers = [
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 5.2",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
]
dynamic = [
    "version",
]
dependencies = [
    "allianceauth>=5",
    "django-esi",
    "django-eveonline-sde",
]
urls.Changelog = "https://github.com/BroodLK/aa-hostile-intel/blob/master/CHANGELOG.md"
urls.Tracker = "https://github.com/BroodLK/aa-hostile-intel/issues"

[tool.hatch]
version.path = "hostile/__init__.py"
build.include = [
    "/hostile",
]
